name: Build and test
run-name: Build and test — ${{ github.event_name }} — ${{ github.head_ref || github.ref_name }}
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-style:
    name: Code style (clang-format 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check all C sources and headers
        shell: bash
        run: bash scripts/check_style.sh 2>&1 | tee code-style.log
      - name: Preserve code style diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-style-diagnostics
          path: code-style.log
          if-no-files-found: ignore
  documentation:
    name: Documentation (Doxygen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Check documentation
        shell: bash
        run: bash scripts/check_docs.sh 2>&1 | tee doxygen.log
      - name: Preserve documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-diagnostics
          path: doxygen.log
          if-no-files-found: ignore
  linux:
    name: Build and test (Linux, ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: gcc
          - name: Clang
            compiler: clang
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: bash scripts/build.sh
        env:
          CC: ${{ matrix.compiler }}
          BUILD_DIR: build/${{ matrix.compiler }}
      - name: Preserve failed functional outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-Linux-${{ matrix.name }}
          path: test/functional/**/actual_*.txt
          if-no-files-found: ignore
  windows:
    name: Build and test (Windows, GCC ${{ matrix.msystem }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW32
            prefix: mingw-w64-i686
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-make
      - name: Build and test
        shell: msys2 {0}
        run: MSYS2_ARG_CONV_EXCL='*' cmd.exe /d /c 'scripts\build_mingw.cmd'
      - name: Build release
        shell: msys2 {0}
        run: MSYS2_ARG_CONV_EXCL='*' cmd.exe /d /c 'scripts\build_release_mingw.cmd'
      - name: Preserve failed functional outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-Windows-GCC-${{ matrix.msystem }}
          path: test/functional/**/actual_*.txt
          if-no-files-found: ignore
