name: build and test
run-name: ${{ github.actor }} is building the Goat interpreter
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: ./build.sh
        shell: bash
  windows:
    name: Windows (${{ matrix.msystem }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW32
            prefix: mingw-w64-i686
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-make
      - name: Build and test through the Windows script
        shell: msys2 {0}
        run: MSYS2_ARG_CONV_EXCL='*' cmd.exe /d /c build_mingw.cmd
      - name: Preserve failed functional outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.msystem }}
          path: test/functional/**/actual_*.txt
          if-no-files-found: ignore
