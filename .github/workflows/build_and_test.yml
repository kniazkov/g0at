name: Build and test
run-name: Build and test — ${{ github.event_name }} — ${{ github.head_ref || github.ref_name }}
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-style:
    name: Code style (clang-format 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check all C sources and headers
        shell: bash
        run: |
          mkdir -p build/ci
          bash scripts/check_style.sh 2>&1 | tee build/ci/code-style.log
      - name: Preserve code style diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-style-diagnostics
          path: build/ci/code-style.log
          if-no-files-found: ignore
      - name: Verify normal cycle leaves the checkout clean
        shell: bash
        run: |
          mkdir -p build/ci
          git status --porcelain --untracked-files=all | tee build/ci/checkout-status.log
          test ! -s build/ci/checkout-status.log
      - name: Preserve checkout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-code-style
          path: build/ci/checkout*.log
          if-no-files-found: ignore
  documentation:
    name: Documentation (Doxygen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Check documentation
        shell: bash
        run: |
          mkdir -p build/ci
          bash scripts/check_docs.sh 2>&1 | tee build/ci/doxygen.log
      - name: Preserve documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-diagnostics
          path: build/ci/doxygen.log
          if-no-files-found: ignore
      - name: Preserve browsable documentation
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/doxygen-check/html
          if-no-files-found: error
          retention-days: 7
      - name: Verify normal cycle leaves the checkout clean
        shell: bash
        run: |
          mkdir -p build/ci
          git status --porcelain --untracked-files=all | tee build/ci/checkout-status.log
          test ! -s build/ci/checkout-status.log
      - name: Preserve checkout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-documentation
          path: build/ci/checkout*.log
          if-no-files-found: ignore
  musl:
    name: Native musl delivery (Linux, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build real glibc control producer
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          sudo apt-get update
          sudo apt-get install -y gcc cmake make
          cmake -S . -B build/libc-control -DCMAKE_BUILD_TYPE=Release
          cmake --build build/libc-control --parallel 2 --target goat goat-inspect goat-merge module_native_testing module_musl_scenarios
          mkdir -p build/libc-delivery
          build/libc-control/module_musl_scenarios integration.module_musl.produce build/libc-control/goat build/libc-control/goat-inspect build/libc-control/goat-merge build/libc-control/module_native_testing gcc glibc build/libc-control test/data docs/module-format-v1 --destination build/libc-delivery
          (cd build/libc-delivery && sha256sum glibc.gbin glibc-host.json > glibc.sha256)
      - name: Build, package and execute under real musl
        run: |
          docker run --rm --network bridge \
            -v "$PWD:/source:ro" -v "$PWD/build/libc-delivery:/results" \
            alpine:3.22 sh -euxc '
              apk add --no-cache bash build-base cmake linux-headers
              bash -euo pipefail /source/scripts/check_musl_ci.sh
            '
      - name: Verify actual musl artifact is foreign to glibc process
        run: |
          (cd build/libc-delivery && sha256sum -c glibc.sha256 musl.sha256)
          build/libc-control/module_musl_scenarios integration.module_musl.verify build/libc-control/goat build/libc-control/goat-inspect build/libc-control/goat-merge build/libc-control/module_native_testing gcc glibc build/libc-control test/data docs/module-format-v1 --destination build/libc-delivery
          (cd build/libc-delivery && sha256sum -c glibc.sha256 musl.sha256)
      - name: Preserve musl package and immutable cross-runtime artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goat-musl-${{ matrix.arch }}
          path: |
            build/libc-delivery
            build/libc-control/scenario-*
          if-no-files-found: error
      - name: Verify normal cycle leaves the checkout clean
        shell: bash
        run: |
          mkdir -p build/ci
          git status --porcelain --untracked-files=all | tee build/ci/checkout-status.log
          test ! -s build/ci/checkout-status.log
      - name: Preserve checkout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-musl-${{ matrix.arch }}
          path: build/ci/checkout*.log
          if-no-files-found: ignore
  linux:
    name: Build and test (Linux, ${{ matrix.arch }}, ${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      # Configuration must succeed without a C++ compiler.
      CXX: /nonexistent/cxx
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: gcc
            arch: x86_64
            runner: ubuntu-24.04
          - name: Clang
            compiler: clang
            arch: x86_64
            runner: ubuntu-24.04
          - name: GCC
            compiler: gcc
            arch: aarch64
            runner: ubuntu-24.04-arm
          - name: Clang
            compiler: clang
            arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture and install build tools
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          sudo apt-get update
          sudo apt-get install -y gcc clang cmake make ninja-build
      - name: Check synchronized parallel build output
        run: cmake -P test/build_output.cmake
        env:
          CC: ${{ matrix.compiler }}
      - name: Check local full-check orchestration
        run: cmake -P test/full_check_driver.cmake
        env:
          CC: ${{ matrix.compiler }}
      - name: Build Debug binaries from outside the checkout
        run: |
          repo_root="$PWD"
          cd "$RUNNER_TEMP"
          bash "$repo_root/scripts/build.sh" --build-only
          grep -Fx "CMAKE_HOME_DIRECTORY:INTERNAL=$repo_root" "$repo_root/$BUILD_DIR/CMakeCache.txt"
          test -f "$repo_root/$BUILD_DIR/CPackConfig.cmake"
        env:
          CC: ${{ matrix.compiler }}
          BUILD_DIR: build/${{ matrix.compiler }}
      - name: Run Debug core tests from outside the checkout
        run: |
          repo_root="$PWD"
          cd "$RUNNER_TEMP"
          bash "$repo_root/scripts/build.sh" --test-only
        env:
          CC: ${{ matrix.compiler }}
          BUILD_DIR: build/${{ matrix.compiler }}
      - name: List Debug test suites
        run: |
          cmake -S . -B build/${{ matrix.compiler }}
          ctest --test-dir build/${{ matrix.compiler }} -N
      - name: Verify Debug format references and frozen inputs
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -R "^format[.]reference$|^tool[.]frozen-samples"
      - name: Build Debug sanitizer test runners
        run: |
          cmake --build build/${{ matrix.compiler }} --target format_binary_ubsan_testing format_oracle_ubsan_testing integer_oracle_ubsan_testing
        env:
          CC: ${{ matrix.compiler }}
      - name: Run Debug integration suites
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure --parallel 4 -L integration
        env:
          CC: ${{ matrix.compiler }}
      - name: Run Debug framework suites
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure --parallel 4 -L "build-publication|process-input|process-stream|scenario-context|scenario-execution|scenario-registry|module-schema|unicode-generator|integer-oracle|format-oracle|frozen-samples-c|format-vectors|migration-helpers|process-watch"
        env:
          CC: ${{ matrix.compiler }}
      - name: Verify registered native runner
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -R "^native.c_module$"
      - name: Execute newer-built module at its declared glibc minimum
        # Select a controlled userspace from the actual produced requirement.
        # Require exact equality with the module minimum, not just a newer libc.
        run: |
          requirements_args=(build/${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/native_toolchain_testing build/${{ matrix.compiler }}/module_native_testing ${{ matrix.compiler }} build/${{ matrix.compiler }} test/data docs/module-format-v1 --destination build/runtime-floor)
          build/${{ matrix.compiler }}/module_delivery_requirements_scenarios integration.module_delivery_requirements.prepare-floor "${requirements_args[@]}"
          runtime_image=$(build/${{ matrix.compiler }}/module_delivery_requirements_scenarios integration.module_delivery_requirements.floor-image "${requirements_args[@]}")
          mkdir -p build/runtime-floor-evidence
          docker run --rm --network bridge \
            -v "$PWD:/source:ro" -v "$PWD/build/runtime-floor-evidence:/evidence" "$runtime_image" bash -euxo pipefail -c '
              trap '"'"'status=$?; if [ "$status" -ne 0 ]; then shopt -s nullglob; for work in /tmp/goat-floor/scenario-*; do cp -a "$work" /evidence/; done; fi; exit "$status"'"'"' EXIT
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc libc6-dev cmake make
              cmake -S /source -B /tmp/goat-floor -DCMAKE_BUILD_TYPE=Release
              cmake --build /tmp/goat-floor --parallel 2 --target goat module_delivery_requirements_scenarios
              /tmp/goat-floor/module_delivery_requirements_scenarios integration.module_delivery_requirements.verify-floor \
                /tmp/goat-floor/goat /tmp/goat-floor/native_toolchain_testing /tmp/goat-floor/module_native_testing \
                gcc /tmp/goat-floor /source/test/data /source/docs/module-format-v1 \
                --destination /source/build/runtime-floor
            '
      - name: Module loading allocation failures
        run: |
          for mode in Debug Release; do
            cmake -S . -B build/memory-fault-$mode -DCMAKE_BUILD_TYPE=$mode \
              -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DGOAT_TEST_ALLOC_FAILURE=ON
            cmake --build build/memory-fault-$mode --parallel 2 --target module_memory_scenarios
            ctest --test-dir build/memory-fault-$mode --output-on-failure -L module-memory-migration
          done
      - name: Module JSON with nonzero automatic-variable initialization
        run: |
          cmake -S . -B build/json-stack-pattern \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_C_FLAGS=-ftrivial-auto-var-init=pattern
          cmake --build build/json-stack-pattern --parallel 2 --target module_json_scenarios module_canonical_hash_scenarios
          build/json-stack-pattern/module_json_testing
          ctest --test-dir build/json-stack-pattern --output-on-failure -R "^native.module_(json|canonical|hash)$"
      - name: Compile Linux shared libraries
        run: |
          bash scripts/check_native_library.sh build/${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/native-library
        env:
          CC: ${{ matrix.compiler }}
      - name: Load and validate native libraries
        run: |
          bash scripts/check_native_loader.sh build/${{ matrix.compiler }}/goat "build/${{ matrix.compiler }}/native loader"
        env:
          CC: ${{ matrix.compiler }}
      - name: Dispatch native adapters through CALL
        run: |
          bash scripts/check_native_call.sh build/${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/unit_testing "build/${{ matrix.compiler }}/native call"
        env:
          CC: ${{ matrix.compiler }}
      - name: Execute generated libraries and retry bounded native calls
        run: |
          bash scripts/check_native_pipeline.sh build/${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/unit_testing "build/${{ matrix.compiler }}/native pipeline"
        env:
          CC: ${{ matrix.compiler }}
      - name: Compare native modes and verify actual adapter entry
        run: |
          bash scripts/check_native_modes.sh build/${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/functional_testing "build/${{ matrix.compiler }}/native modes"
        env:
          CC: ${{ matrix.compiler }}
      - name: Run Debug native correctness and performance controls
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -L "native-runner-migration|native-access-libm-migration|native-strings-migration|native-saturation-migration|native-performance-controls"
        env:
          CC: ${{ matrix.compiler }}
      - name: Check interactive sessions
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -R "^native.interactive$"
      - name: Check character semantics
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -R "^native.characters$"
      - name: Check portable bytecode v1
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -R "^native.bytecode_v1$"
      - name: Check portable Unicode strings
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -R "^native.unicode$"
      - name: Check native artifact integrity
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -L "native-integrity-migration"
        env:
          CC: ${{ matrix.compiler }}
      - name: Check for loops and source round trips
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -R '^native[.]for$'
        env:
          CC: ${{ matrix.compiler }}

      - name: Check indexed access and source/binary round trips
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -R '^native[.]index$'
        env:
          CC: ${{ matrix.compiler }}
      - name: Compile and execute persisted programs
        run: |
          bash scripts/check_binary_program.sh build/${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/functional_testing "build/${{ matrix.compiler }}/binary programs"
        env:
          CC: ${{ matrix.compiler }}
      - name: Check numeric adapter ABI
        run: |
          bash scripts/check_native_abi.sh build/${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/native-abi
        env:
          CC: ${{ matrix.compiler }}
      - name: Check native strings with sanitizers
        run: |
          ctest --test-dir build/${{ matrix.compiler }} --output-on-failure -L native-strings-sanitizer
        env:
          CC: ${{ matrix.compiler }}
      - name: Check numeric adapter ABI with sanitizers
        run: |
          bash scripts/check_native_abi.sh build/${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/native-abi-ubsan -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all
        env:
          CC: ${{ matrix.compiler }}
      - name: Check numeric adapter ABI with x87 evaluation
        if: matrix.compiler == 'gcc' && matrix.arch == 'x86_64'
        run: |
          bash scripts/check_native_abi.sh build/gcc/goat build/gcc/native-abi-x87 -mfpmath=387
      - name: Export, compile and execute C modules
        run: |
          bash scripts/check_c_module.sh build/${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/c-module
        env:
          CC: ${{ matrix.compiler }}
      - name: Compile and execute generated C
        run: |
          bash scripts/check_c_generation.sh build/${{ matrix.compiler }}/unit_testing build/${{ matrix.compiler }}/c-generation
        env:
          CC: ${{ matrix.compiler }}
      - name: Check generated C with undefined-behavior sanitizer
        run: |
          bash scripts/check_c_generation.sh build/${{ matrix.compiler }}/unit_testing build/${{ matrix.compiler }}/c-generation-ubsan -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all
        env:
          CC: ${{ matrix.compiler }}
      - name: Check generated C with x87 evaluation
        if: matrix.compiler == 'gcc' && matrix.arch == 'x86_64'
        run: |
          bash scripts/check_c_generation.sh build/gcc/unit_testing build/gcc/c-generation-x87 -mfpmath=387
      - name: Preserve generated C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-C-Linux-${{ matrix.arch }}-${{ matrix.name }}
          path: |
            build/${{ matrix.compiler }}/c-generation/generated.c
            build/${{ matrix.compiler }}/c-module/*.c
            build/${{ matrix.compiler }}/native-abi/*.c
            build/${{ matrix.compiler }}/native-library/program.c
            build/${{ matrix.compiler }}/native-library/program.so
          if-no-files-found: ignore
      - name: Build Release binaries and package
        run: |
          bash scripts/build_release.sh
        env:
          CC: ${{ matrix.compiler }}
          BUILD_DIR: build/release-${{ matrix.compiler }}
          CMAKE_BUILD_PARALLEL_LEVEL: 4
      - name: Check relocated release package
        run: |
          for config in build/${{ matrix.compiler }} build/release-${{ matrix.compiler }}; do
            "$config/package_scenarios" integration.package.end-to-end build/release-${{ matrix.compiler }}/packages "$config/module_delivery_scenarios" "$(command -v "$CC")" "$PWD" "$(command -v cmake)" --timeout-seconds 1800
          done
        env:
          CC: ${{ matrix.compiler }}
      - name: Preserve release package
        uses: actions/upload-artifact@v4
        with:
          name: goat-Linux-${{ matrix.arch }}-${{ matrix.name }}
          path: build/release-${{ matrix.compiler }}/packages/*.tar.gz
          if-no-files-found: error
      - name: Build Release test runners
        run: |
          cmake --build build/release-${{ matrix.compiler }} --parallel 4 --target format_binary_ubsan_testing format_oracle_ubsan_testing integer_oracle_ubsan_testing module_import_execution_testing child_process_input_testing child_process_stream_testing scenario_context_testing scenario_execution_testing scenario_registry_testing module_schema_generator_testing unicode_generator_testing integer_oracle_testing format_oracle_testing format_binary_testing module_execution_testing inspect_report_testing process_watch_testing loop_index_testing unicode_interactive_testing bytecode_v1_testing module_json_scenarios module_canonical_hash_scenarios zip_scenarios module_container_scenarios module_bytecode_scenarios module_abi_scenarios module_native_scenarios module_sources_scenarios module_files_scenarios module_imports_scenarios source_include_scenarios module_search_scenarios module_dependencies_scenarios module_graph_scenarios module_snapshot_scenarios module_identity_scenarios module_serialization_scenarios module_initialization_scenarios module_initialization_contract_scenarios module_exception_scenarios module_incomplete_scopes_scenarios module_failed_prototypes_scenarios module_access_scenarios module_multifile_access_scenarios module_context_scenarios module_function_provenance_scenarios module_assignment_scenarios module_import_execution_scenarios module_interface_scenarios module_source_diagnostics_scenarios module_information_scenarios module_dispatch_consistency_scenarios module_validation_scenarios module_writer_scenarios module_build_scenarios module_library_scenarios module_loading_scenarios module_cli_scenarios module_inspect_scenarios inspect_probe_scenarios module_merge_scenarios module_delivery_scenarios package_scenarios frozen_samples format_vectors graph_scenarios module_book_scenarios module_delivery_requirements_scenarios module_musl_scenarios child_process_scenarios cleanup_service_scenarios process_exit_scenarios module_exit_scenarios module_threads_scenarios native_requirements_scenarios native_toolchains_scenarios native_artifact_scenarios native_integrity_scenarios native_cleanup_scenarios native_exit_scenarios module_native_values_scenarios native_runner_testing native_runner_policy_testing native_access_scenarios native_libm_scenarios native_runtime_strings_scenarios native_string_method_scenarios native_saturation_scenarios native_performance_scenarios timed_execution_testing
      - name: Verify Release format references and frozen inputs
        run: |
          ctest --test-dir build/release-${{ matrix.compiler }} --output-on-failure -R "^format[.]reference$|^tool[.]frozen-samples"
      - name: Run Release framework, module and native suites
        run: |
          ctest --test-dir build/release-${{ matrix.compiler }} --output-on-failure --parallel 4 -L "build-publication|process-input|process-stream|scenario-context|scenario-execution|scenario-registry|module-schema|unicode-generator|integer-oracle|format-oracle|frozen-samples-c|format-vectors|migration-helpers|process-watch|language-roundtrip|unicode-interactive|standalone-bytecode|metadata-json|canonical-hash|zip-migration|container-migration|module-bytecode-migration|module-abi-native-migration|module-sources-files-migration|imports-include-migration|module-search-migration|module-dependencies-migration|module-graph-migration|module-snapshot-migration|module-identity-serialization-migration|module-initialization-migration|module-contract-exceptions-migration|module-scopes-prototypes-migration|module-access-migration|module-multifile-access-migration|module-context-provenance-migration|module-assignment-migration|module-execution-interface-migration|module-source-diagnostics-migration|module-information-migration|module-dispatch-consistency-migration|module-validation-migration|module-writer-migration|module-build-library-migration|module-loading-migration|module-cli-migration|module-inspect-migration|inspect-probe-migration|module-merge-migration|module-delivery-migration|package-controls|graph-validation-migration|module-book-migration|module-delivery-requirements-migration|module-musl-migration|child-process-migration|cleanup-service-migration|process-exit-migration|module-exit-migration|module-threads-migration|native-requirements-migration|native-toolchains-migration|native-artifact-migration|native-integrity-migration|native-cleanup-migration|native-exit-values-migration|native-runner-migration|native-access-libm-migration|native-strings-migration|native-saturation-migration|native-performance-controls"
      - name: Smoke test release
        run: |
          ./target/goat example/hello_world.goat
      - name: Compare release native modes
        run: |
          bash scripts/check_native_modes.sh build/release-${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/functional_testing "build/${{ matrix.compiler }}/native modes release"
        env:
          CC: ${{ matrix.compiler }}
      - name: Compile and execute persisted Release programs
        run: |
          bash scripts/check_binary_program.sh build/release-${{ matrix.compiler }}/goat build/${{ matrix.compiler }}/functional_testing "build/${{ matrix.compiler }}/binary programs release"
        env:
          CC: ${{ matrix.compiler }}
      - name: Compare precompiled VM and native performance
        run: |
          ctest --test-dir build/release-${{ matrix.compiler }} --output-on-failure -R "^integration.native_performance.benchmark$"
        env:
          CC: ${{ matrix.compiler }}
      - name: Preserve native execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-execution-Linux-${{ matrix.arch }}-${{ matrix.name }}
          path: |
            build/${{ matrix.compiler }}/native functional
            build/**/scenario-*/**/timings.json
            build/**/scenario-*/**/vm.report
            build/**/scenario-*/**/native.report
            build/**/scenario-*/**/saved.report
            build/**/scenario-*/**/*.command.json
            build/**/scenario-*/**/*.stdout
            build/**/scenario-*/**/*.stderr
            build/${{ matrix.compiler }}/native modes
            build/${{ matrix.compiler }}/native modes release
            build/${{ matrix.compiler }}/binary programs
            build/${{ matrix.compiler }}/binary programs release
            build/**/native performance/**
          if-no-files-found: ignore
      - name: Render analysis graphs
        id: analysis_graphs
        if: matrix.compiler == 'gcc' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          GRAPH_SCENARIOS_BINARY="$PWD/build/${{ matrix.compiler }}/graph_scenarios" GRAPH_BUILD_ROOT="$PWD/build/${{ matrix.compiler }}" bash scripts/check_graph.sh
      - name: Preserve analysis graphs
        if: always() && steps.analysis_graphs.outcome != 'skipped' && matrix.compiler == 'gcc' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: analysis-graphs
          path: |
            build/*-analysis.svg
            build/*-output.txt
          if-no-files-found: error
      - name: Show retained scenario diagnostics
        if: failure()
        shell: bash
        run: |
          find build -path '*/scenario-*/execution.log' -type f -print -exec cat {} \;
      - name: Preserve failed functional outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-Linux-${{ matrix.arch }}-${{ matrix.name }}
          path: |
            build/full-check-driver-test/**
            build/build-output-test/**
            build/**/package-diagnostics/**
            build/runtime-floor-evidence/**
            build/runtime-floor/**
            build/**/scenario-*/requirements work/**
            build/**/scenario-*/module tutorial/**
            build/**/scenario-*/graph*
            build/**/scenario-*/**/*.svg
            build/**/scenario-*/**/*-output.txt
            build/**/scenario-*/**/*.actual
            build/**/scenario-*/**/*.expected
            build/**/functional-fixtures-*/**/actual_*.txt
            build/**/scenario-*/**/*.log
            build/**/scenario-*/**/*.stdout
            build/**/scenario-*/**/*.stderr
            build/**/scenario-*/**/*.report
            build/**/scenario-*/**/*.goat
            build/**/scenario-*/**/host-*.c
            build/**/scenario-*/**/edges.c
            build/**/scenario-*/owner-*/stdout.bin
            build/**/scenario-*/owner-*/stderr.bin
            build/**/scenario-*/terminal-*/stdout.bin
            build/**/scenario-*/terminal-*/stderr.bin
          if-no-files-found: ignore
      - name: Verify normal cycle leaves the checkout clean
        shell: bash
        run: |
          mkdir -p build/ci
          git status --porcelain --untracked-files=all | tee build/ci/checkout-status.log
          test ! -s build/ci/checkout-status.log
      - name: Preserve checkout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-linux-${{ matrix.arch }}-${{ matrix.compiler }}
          path: build/ci/checkout*.log
          if-no-files-found: ignore
  windows:
    name: Build and test (Windows, GCC ${{ matrix.msystem }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: MINGW32
            prefix: mingw-w64-i686
          - msystem: MINGW64
            prefix: mingw-w64-x86_64
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Record native checkout Git
        shell: pwsh
        run: |
          $git = (Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if ($git -isnot [string] -or [string]::IsNullOrWhiteSpace($git) -or -not (Test-Path -LiteralPath $git -PathType Leaf)) {
            throw 'Checkout Git must resolve to one existing executable'
          }
          "GOAT_CHECKOUT_GIT=$git" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force build/ci | Out-Null
          "Git: $git" | Tee-Object -FilePath build/ci/checkout-git.log
          & $git --version | Tee-Object -Append -FilePath build/ci/checkout-git.log
          & $git config --show-origin --get-regexp '^core\.(autocrlf|eol|filemode)$' | Tee-Object -Append -FilePath build/ci/checkout-git.log
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect checkout Git configuration' }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            diffutils
            ${{ matrix.prefix }}-gcc
            mingw-w64-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-make
            ${{ matrix.prefix }}-ninja
      - name: Locate both Windows native delivery compilers
        shell: msys2 {0}
        run: |
          echo "GOAT_DELIVERY_MINGW64_CC=$(cygpath -w /mingw64/bin/gcc.exe)" >> "$GITHUB_ENV"
          echo "GOAT_DELIVERY_UCRT64_CC=$(cygpath -w /ucrt64/bin/gcc.exe)" >> "$GITHUB_ENV"
      - name: Check synchronized parallel build output
        shell: msys2 {0}
        run: cmake -P test/build_output.cmake
      - name: Check local full-check orchestration
        shell: msys2 {0}
        run: cmake -P test/full_check_driver.cmake
      - name: Build Debug binaries
        shell: msys2 {0}
        run: |
          MSYS2_ARG_CONV_EXCL='*' cmd.exe /d /c 'scripts\build_mingw.cmd --build-only'
      - name: Run Debug core tests
        shell: msys2 {0}
        run: |
          MSYS2_ARG_CONV_EXCL='*' cmd.exe /d /c 'scripts\build_mingw.cmd --test-only'
      - name: List Debug test suites
        shell: msys2 {0}
        run: |
          cmake -S . -B build
          ctest --test-dir build -N
      - name: Verify Debug format references and frozen inputs
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -R "^format[.]reference$|^tool[.]frozen-samples"
      - name: Run Debug integration suites
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure --parallel 4 -L integration
      - name: Run Debug framework suites
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure --parallel 4 -L "build-publication|process-input|process-stream|scenario-context|scenario-execution|scenario-registry|module-schema|unicode-generator|integer-oracle|format-oracle|frozen-samples-c|format-vectors|migration-helpers|process-watch"
      - name: Verify registered native runner
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -R "^native.c_module$"
      - name: Module loading allocation failures
        shell: msys2 {0}
        run: |
          for mode in Debug Release; do
            cmake -S . -B build/memory-fault-$mode -G "MinGW Makefiles" \
              -DCMAKE_BUILD_TYPE=$mode -DGOAT_TEST_ALLOC_FAILURE=ON
            cmake --build build/memory-fault-$mode --parallel 2 --target module_memory_scenarios
            ctest --test-dir build/memory-fault-$mode --output-on-failure -L module-memory-migration
          done
      - name: Check Windows API target compatibility
        shell: msys2 {0}
        run: |
          bash scripts/check_windows_target.sh build/windows-target
      - name: Compile Windows DLLs and check numeric compatibility
        shell: msys2 {0}
        run: |
          bash scripts/check_native_windows.sh build/goat.exe build/native-windows
      - name: Load and validate native libraries
        shell: msys2 {0}
        run: |
          bash scripts/check_native_loader.sh build/goat.exe "build/native loader"
      - name: Dispatch native adapters through CALL
        shell: msys2 {0}
        run: |
          bash scripts/check_native_call.sh build/goat.exe build/unit_testing.exe "build/native call"
      - name: Execute generated libraries and retry bounded native calls
        shell: msys2 {0}
        run: |
          bash scripts/check_native_pipeline.sh build/goat.exe build/unit_testing.exe "build/native pipeline"
      - name: Compare native modes and verify actual adapter entry
        shell: msys2 {0}
        run: |
          bash scripts/check_native_modes.sh build/goat.exe build/functional_testing.exe "build/native modes"
      - name: Run Debug native correctness and performance controls
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -L "native-runner-migration|native-access-libm-migration|native-strings-migration|native-saturation-migration|native-performance-controls"
      - name: Check interactive sessions
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -R "^native.interactive$"
      - name: Check character semantics
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -R "^native.characters$"
      - name: Check portable bytecode v1
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -R "^native.bytecode_v1$"
      - name: Check portable Unicode strings
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -R "^native.unicode$"
      - name: Check native artifact integrity
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -L "native-integrity-migration"
      - name: Check for loops and source round trips
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -R '^native[.]for$'

      - name: Check indexed access and source/binary round trips
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -R '^native[.]index$'
      - name: Compile and execute persisted programs
        shell: msys2 {0}
        run: |
          bash scripts/check_binary_program.sh build/goat.exe build/functional_testing.exe "build/binary programs"
      - name: Check numeric adapter ABI
        shell: msys2 {0}
        run: |
          bash scripts/check_native_abi.sh build/goat.exe build/native-abi
      - name: Export, compile and execute C modules
        shell: msys2 {0}
        run: |
          bash scripts/check_c_module.sh build/goat.exe build/c-module
      - name: Compile and execute generated C
        shell: msys2 {0}
        run: |
          bash scripts/check_c_generation.sh build/unit_testing.exe build/c-generation
      - name: Preserve generated C
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-C-Windows-${{ matrix.msystem }}
          path: |
            build/c-generation/generated.c
            build/c-module/*.c
            build/native-abi/*.c
            build/native-windows/program.c
            build/native-windows/program.dll
          if-no-files-found: ignore
      - name: Check Windows build observer
        shell: msys2 {0}
        run: bash scripts/check_windows_observer.sh
      - name: Preserve Windows observer controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-control-${{ matrix.msystem }}
          path: build/ci/observer-control/**
          if-no-files-found: warn
      - name: Build Release binaries and package
        # A normal run takes a few minutes. Bound CI only, so a stalled tool
        # produces a finished log instead of occupying the runner for hours.
        timeout-minutes: 15
        shell: msys2 {0}
        run: |
          bash scripts/observe_release_mingw.sh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
      - name: Preserve Windows Release observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-observation-${{ matrix.msystem }}
          path: |
            build/ci/release-observation/**
            build/ci/release-build.log
            build/release/CMakeCache.txt
            build/release/Makefile
            build/release/CMakeFiles/Makefile2
            build/release/CPackConfig.cmake
            build/release/cmake_install.cmake
            build/release/_CPack_Packages/**/PreinstallOutput.log
            build/release/_CPack_Packages/**/PreinstallOutput.log.verbose
          if-no-files-found: warn
      - name: Repeat Windows Release packaging ten times
        timeout-minutes: 15
        shell: msys2 {0}
        run: bash scripts/repeat_windows_package.sh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
      - name: Preserve Windows package repetitions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-repetitions-${{ matrix.msystem }}
          path: build/ci/package-repetitions/**
          if-no-files-found: warn
      - name: Check relocated release package
        shell: msys2 {0}
        run: |
          for config in build build/release; do
            "$config/package_scenarios.exe" integration.package.end-to-end "$(cygpath -w "$PWD/build/release/packages")" "$(cygpath -w "$PWD/$config/module_delivery_scenarios.exe")" "$(cygpath -w "$(command -v gcc)")" "$(cygpath -w "$PWD")" "$(cygpath -w "$(command -v cmake)")" --timeout-seconds 1800
          done
      - name: Preserve release package
        uses: actions/upload-artifact@v4
        with:
          name: goat-Windows-${{ matrix.msystem }}
          path: build/release/packages/*.zip
          if-no-files-found: error
      - name: Build Release test runners
        shell: msys2 {0}
        run: |
          cmake -S . -B build/release
          cmake --build build/release --parallel 4 --target module_import_execution_testing child_process_input_testing child_process_stream_testing scenario_context_testing scenario_execution_testing scenario_registry_testing module_schema_generator_testing unicode_generator_testing integer_oracle_testing format_oracle_testing format_binary_testing module_execution_testing inspect_report_testing process_watch_testing loop_index_testing unicode_interactive_testing bytecode_v1_testing module_json_scenarios module_canonical_hash_scenarios zip_scenarios module_container_scenarios module_bytecode_scenarios module_abi_scenarios module_native_scenarios module_sources_scenarios module_files_scenarios module_imports_scenarios source_include_scenarios module_search_scenarios module_dependencies_scenarios module_graph_scenarios module_snapshot_scenarios module_identity_scenarios module_serialization_scenarios module_initialization_scenarios module_initialization_contract_scenarios module_exception_scenarios module_incomplete_scopes_scenarios module_failed_prototypes_scenarios module_access_scenarios module_multifile_access_scenarios module_context_scenarios module_function_provenance_scenarios module_assignment_scenarios module_import_execution_scenarios module_interface_scenarios module_source_diagnostics_scenarios module_information_scenarios module_dispatch_consistency_scenarios module_validation_scenarios module_writer_scenarios module_build_scenarios module_library_scenarios module_loading_scenarios module_cli_scenarios module_inspect_scenarios inspect_probe_scenarios module_merge_scenarios module_delivery_scenarios package_scenarios frozen_samples format_vectors graph_scenarios module_book_scenarios module_delivery_requirements_scenarios module_musl_scenarios child_process_scenarios cleanup_service_scenarios process_exit_scenarios module_exit_scenarios module_threads_scenarios native_requirements_scenarios native_toolchains_scenarios native_artifact_scenarios native_integrity_scenarios native_cleanup_scenarios native_exit_scenarios module_native_values_scenarios native_runner_testing native_runner_policy_testing native_access_scenarios native_libm_scenarios native_runtime_strings_scenarios native_string_method_scenarios native_saturation_scenarios native_performance_scenarios timed_execution_testing
      - name: Verify Release format references and frozen inputs
        shell: msys2 {0}
        run: |
          ctest --test-dir build/release --verbose --output-on-failure -R "^format[.]reference$|^tool[.]frozen-samples"
      - name: Run Release framework, module and native suites
        shell: msys2 {0}
        run: |
          ctest --test-dir build/release --output-on-failure --parallel 4 -L "build-publication|process-input|process-stream|scenario-context|scenario-execution|scenario-registry|module-schema|unicode-generator|integer-oracle|format-oracle|frozen-samples-c|format-vectors|migration-helpers|process-watch|language-roundtrip|unicode-interactive|standalone-bytecode|metadata-json|canonical-hash|zip-migration|container-migration|module-bytecode-migration|module-abi-native-migration|module-sources-files-migration|imports-include-migration|module-search-migration|module-dependencies-migration|module-graph-migration|module-snapshot-migration|module-identity-serialization-migration|module-initialization-migration|module-contract-exceptions-migration|module-scopes-prototypes-migration|module-access-migration|module-multifile-access-migration|module-context-provenance-migration|module-assignment-migration|module-execution-interface-migration|module-source-diagnostics-migration|module-information-migration|module-dispatch-consistency-migration|module-validation-migration|module-writer-migration|module-build-library-migration|module-loading-migration|module-cli-migration|module-inspect-migration|inspect-probe-migration|module-merge-migration|module-delivery-migration|package-controls|graph-validation-migration|module-book-migration|module-delivery-requirements-migration|module-musl-migration|child-process-migration|cleanup-service-migration|process-exit-migration|module-exit-migration|module-threads-migration|native-requirements-migration|native-toolchains-migration|native-artifact-migration|native-integrity-migration|native-cleanup-migration|native-exit-values-migration|native-runner-migration|native-access-libm-migration|native-strings-migration|native-saturation-migration|native-performance-controls"
      - name: Compare release native modes
        shell: msys2 {0}
        run: |
          bash scripts/check_native_modes.sh build/release/goat.exe build/functional_testing.exe "build/native modes release"
      - name: Compile and execute persisted Release programs
        shell: msys2 {0}
        run: |
          bash scripts/check_binary_program.sh build/release/goat.exe build/functional_testing.exe "build/binary programs release"
      - name: Compare precompiled VM and native performance
        shell: msys2 {0}
        run: |
          ctest --test-dir build/release --output-on-failure -R "^integration.native_performance.benchmark$"
      - name: Preserve native execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-execution-Windows-${{ matrix.msystem }}
          path: |
            build/native functional
            build/**/scenario-*/**/timings.json
            build/**/scenario-*/**/vm.report
            build/**/scenario-*/**/native.report
            build/**/scenario-*/**/saved.report
            build/**/scenario-*/**/*.command.json
            build/**/scenario-*/**/*.stdout
            build/**/scenario-*/**/*.stderr
            build/native modes
            build/native modes release
            build/binary programs
            build/binary programs release
            build/**/native performance/**
          if-no-files-found: ignore
      - name: Show retained scenario diagnostics
        if: failure()
        shell: bash
        run: |
          find build -path '*/scenario-*/execution.log' -type f -print -exec cat {} \;
      - name: Preserve failed functional outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-Windows-GCC-${{ matrix.msystem }}
          path: |
            build/ci/release-build.log
            build/full-check-driver-test/**
            build/build-output-test/**
            build/**/scenario-*/**/markers/events
            build/**/package-diagnostics/**
            build/runtime-floor-evidence/**
            build/runtime-floor/**
            build/**/scenario-*/requirements work/**
            build/**/scenario-*/module tutorial/**
            build/**/scenario-*/graph*
            build/**/scenario-*/**/*.svg
            build/**/scenario-*/**/*-output.txt
            build/**/scenario-*/**/*.actual
            build/**/scenario-*/**/*.expected
            build/**/functional-fixtures-*/**/actual_*.txt
            build/**/scenario-*/**/*.log
            build/**/scenario-*/**/*.stdout
            build/**/scenario-*/**/*.stderr
            build/**/scenario-*/**/*.report
            build/**/scenario-*/**/*.goat
            build/**/scenario-*/**/host-*.c
            build/**/scenario-*/**/edges.c
            build/**/scenario-*/owner-*/stdout.bin
            build/**/scenario-*/owner-*/stderr.bin
            build/**/scenario-*/terminal-*/stdout.bin
            build/**/scenario-*/terminal-*/stderr.bin
          if-no-files-found: ignore
      - name: Verify normal cycle leaves the checkout clean
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $git = $env:GOAT_CHECKOUT_GIT
          "Git: $git" | Tee-Object -FilePath build/ci/checkout-git-final.log
          & $git --version | Tee-Object -Append -FilePath build/ci/checkout-git-final.log
          & $git config --show-origin --get-regexp '^core\.(autocrlf|eol|filemode)$' | Tee-Object -Append -FilePath build/ci/checkout-git-final.log
          $status = @(& $git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect checkout status' }
          [IO.File]::WriteAllLines("$PWD/build/ci/checkout-status.log", [string[]]$status)
          $status | Write-Host
          if ($status.Count -ne 0) { throw 'Normal cycle changed the checkout' }
      - name: Preserve checkout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkout-windows-${{ matrix.msystem }}
          path: build/ci/checkout*.log
          if-no-files-found: ignore
