name: Module format v1 vectors
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-vectors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare supported Windows C toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Locate native poison preparation compiler
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "GOAT_NO_PYTHON_CC=$(cygpath -w /ucrt64/bin/gcc.exe)" >> "$GITHUB_ENV"
      - name: Build independent C format and frozen-input checks (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source scripts/no_python.sh
          cmake -S . -B build/format-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/format-host --config Release --target format_vectors frozen_samples format_oracle_testing format_binary_testing module_schema_generator_testing
      - name: Build independent C format and frozen-input checks (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          source scripts/no_python.sh
          cmake -S . -B build/format-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/format-host --config Release --target format_vectors frozen_samples format_oracle_testing format_binary_testing module_schema_generator_testing
      - name: Build independent C format sanitizer checks
        if: runner.os != 'Windows'
        run: |
          source scripts/no_python.sh
          cmake --build build/format-host --config Release --target format_oracle_ubsan_testing format_binary_ubsan_testing
      - name: Check independent C format coverage and frozen-input corruption controls (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source scripts/no_python.sh
          ctest --test-dir build/format-host -C Release --output-on-failure -R "^format[.]|^tool[.]frozen-samples"
      - name: Check independent C format coverage and frozen-input corruption controls (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          source scripts/no_python.sh
          ctest --test-dir build/format-host -C Release --output-on-failure -R "^format[.]|^tool[.]frozen-samples"
      - name: Build standalone host schema generator without core (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source scripts/no_python.sh
          cmake -S tools/module-schema -B build/schema-host
          cmake --build build/schema-host --config Release

      - name: Build standalone host schema generator without core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/no_python.ps1 {
            cmake -S tools/module-schema -B build/schema-host
            cmake --build build/schema-host --config Release

          }
      - name: Check public schemas and production tables without rewriting them (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source scripts/no_python.sh
          ctest --test-dir build/schema-host -C Release --output-on-failure
      - name: Check public schemas and production tables without rewriting them (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/no_python.ps1 {
            ctest --test-dir build/schema-host -C Release --output-on-failure
          }
      - name: Build and check standalone host Unicode generator without core (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source scripts/no_python.sh
          cmake -S tools/unicode -B build/unicode-host
          cmake --build build/unicode-host --config Release
          ctest --test-dir build/unicode-host -C Release --output-on-failure
      - name: Build and check standalone host Unicode generator without core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/no_python.ps1 {
            cmake -S tools/unicode -B build/unicode-host
            cmake --build build/unicode-host --config Release
            ctest --test-dir build/unicode-host -C Release --output-on-failure
          }
      - name: Verify normal cycle leaves the checkout clean (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source scripts/no_python.sh
          git status --porcelain --untracked-files=all | tee build/python-free/checkout-status.log
          test ! -s build/python-free/checkout-status.log
      - name: Verify normal cycle leaves the checkout clean (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          source scripts/no_python.sh
          git status --porcelain --untracked-files=all | tee build/python-free/checkout-status.log
          test ! -s build/python-free/checkout-status.log
      - name: Preserve Python-free dependency proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-free-format-${{ matrix.os }}
          path: build/python-free
          if-no-files-found: error
