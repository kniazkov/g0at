name: Module format v1 vectors
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-vectors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check portable format vectors without regenerating them
        run: python docs/module-format-v1/test_reference.py
      - name: Check production JSON schema tables
        run: python scripts/generate_module_json_schema.py --check
