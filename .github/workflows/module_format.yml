name: Module format v1 vectors
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-vectors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check portable format vectors without regenerating them
        run: python docs/module-format-v1/test_reference.py
      - name: Prepare supported Windows C toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Build independent C format and frozen-input checks (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/format-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/format-host --config Release --target format_vectors frozen_samples format_oracle_testing format_binary_testing module_schema_generator_testing
      - name: Build independent C format and frozen-input checks (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build/format-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/format-host --config Release --target format_vectors frozen_samples format_oracle_testing format_binary_testing module_schema_generator_testing
      - name: Build independent C format sanitizer checks
        if: runner.os != 'Windows'
        run: cmake --build build/format-host --config Release --target format_oracle_ubsan_testing format_binary_ubsan_testing
      - name: Check independent C format coverage and frozen-input corruption controls (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build/format-host -C Release --output-on-failure -L "format-oracle|format-binary|module-schema|frozen-samples-c|format-vectors"
      - name: Check independent C format coverage and frozen-input corruption controls (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build/format-host -C Release --output-on-failure -L "format-oracle|format-binary|module-schema|frozen-samples-c|format-vectors"
      - name: Build standalone host schema generator without core
        run: |
          cmake -S tools/module-schema -B build/schema-host
          cmake --build build/schema-host --config Release
      - name: Check public schemas and production tables without rewriting them
        run: ctest --test-dir build/schema-host -C Release --output-on-failure
      - name: Check frozen Python inputs without rewriting fixtures
        run: python test/support/freeze_python_samples.py --check
      - name: Test frozen input checker rejects corruption
        run: python test/support/freeze_python_samples.py --self-test
      - name: Build and check standalone host Unicode generator without core
        run: |
          cmake -S tools/unicode -B build/unicode-host
          cmake --build build/unicode-host --config Release
          ctest --test-dir build/unicode-host -C Release --output-on-failure
