name: Native dependency investigation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native_dependency_diagnostics.yml'
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler: [gcc, clang]
        configuration: [Debug, Release, Sanitized]
    env:
      CC: ${{ matrix.compiler }}
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Build current interpreter
        run: |
          if [ '${{ matrix.configuration }}' = Sanitized ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all' \
              -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          fi
          cmake --build build --parallel 2 --target goat
      - name: Repeat isolated and concurrent native-required executions
        shell: bash
        run: |
          mkdir -p investigation
          uname -a > investigation/environment.txt
          "$CC" --version >> investigation/environment.txt
          cmake --version >> investigation/environment.txt
          git rev-parse HEAD >> investigation/environment.txt
          python3 - <<'PY'
          import concurrent.futures, json, os, pathlib, signal, subprocess, time
          root = pathlib.Path.cwd()
          logs = root / 'investigation'
          def run(label):
              start = time.monotonic()
              command = ['cmake', '-DGOAT=' + str(root / 'build/goat'),
                         '-DDATA=' + str(root / 'test/data/functional'),
                         '-DWORK=' + str(logs / label),
                         '-P', str(root / 'test/string_builder_modes.cmake')]
              load = os.getloadavg()
              with (logs / (label + '.log')).open('w') as output:
                  process = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT,
                                             start_new_session=True)
                  try:
                      code = process.wait(timeout=600)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                      code = 124
                      output.write('\nInvestigation timeout (600 seconds)\n')
              result = dict(case=label, status=code, load=load, seconds=round(time.monotonic()-start, 2))
              (logs / (label + ".json")).write_text(json.dumps(result))
              print(json.dumps(result), flush=True)
              return result
          results = [run('isolated-' + str(i)) for i in range(5)]
          for workers, count in [(3, 15), (6, 30)]:
              with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as pool:
                  labels = [f'concurrent-{workers}-{i}' for i in range(count)]
                  results += list(pool.map(run, labels))
          (logs / 'results.json').write_text(json.dumps(results, indent=2))
          raise SystemExit(any(item['status'] for item in results))
          PY
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.configuration }}
          path: |
            investigation/*.log
            investigation/*.json
            investigation/environment.txt
            build/CMakeCache.txt
          retention-days: 14
